# Mises à jour automatiques des dépendances : une merge request (pull request) groupée par semaine.
# Le délai de 14 jours (cooldown) écarte les versions trop récentes, souvent visées par les attaques
# de la chaîne d'approvisionnement. Les correctifs de sécurité restent proposés sans délai.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps-e2e"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
